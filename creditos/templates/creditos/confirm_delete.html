{% extends "base.html" %}

{% block content %}
<h2>Eliminar crédito</h2>

<p>
    ¿Seguro que deseas eliminar el crédito
    <strong>#{{ credito.id }}</strong>
    del cliente <strong>{{ credito.cliente.nombre_completo }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'creditos:list' %}">Cancelar</a>
</form>
{% endblock %}
